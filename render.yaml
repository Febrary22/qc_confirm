# Render.com "Blueprint" 배포 설정.
# https://dashboard.render.com/ 에서 New + → Blueprint → 이 저장소 선택 시 자동으로 인식됩니다.
# 별도 서버 지식 없이도 몇 번의 클릭만으로 https:// 주소가 발급되어 직원들과 바로 공유할 수 있습니다.
services:
  - type: web
    name: qc-confirm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # 아무나 접속하지 못하도록 간단한 로그인(HTTP Basic Auth)을 걸고 싶다면 값을 입력하세요.
      # 둘 다 비워두면 인증 없이 누구나 링크로 접속할 수 있습니다.
      - key: QC_BASIC_AUTH_USER
        sync: false
      - key: QC_BASIC_AUTH_PASS
        sync: false

  - type: web
    name: office-tools-streamlit
    runtime: docker
    plan: free
    dockerfilePath: ./streamlit_app/Dockerfile
    dockerContext: .
    envVars:
      # 게시판(자유·문의·아이디어) 글·사진을 영구 저장하는 데 씁니다.
      # 아래 databases: 에 정의한 office-tools-db와 자동으로 연결돼요.
      - key: DATABASE_URL
        fromDatabase:
          name: office-tools-db
          property: connectionString

databases:
  # 게시판용 Postgres 데이터베이스 (유료 플랜, 카드 등록 필요).
  # Blueprint를 처음 적용(Apply)할 때 함께 만들어지고, 위 서비스에 DATABASE_URL로 자동 연결돼요.
  - name: office-tools-db
    plan: basic-256mb
